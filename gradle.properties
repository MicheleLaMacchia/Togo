# Gradle properties for Togo project

# Suppress Kotlin Gradle Plugin deprecation warning for Gradle version
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

# Enable configuration cache (Gradle 8.1+)
org.gradle.configuration-cache=true

# JVM args for daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Parallel execution
org.gradle.parallel=true

# Build cache: riusa output di task già eseguiti (test, KSP, Kotlin)
org.gradle.caching=true

# AndroidX
android.useAndroidX=true