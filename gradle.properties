# Gradle properties for Togo project

# Suppress Kotlin Gradle Plugin deprecation warning for Gradle version
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

# Enable configuration cache (Gradle 8.1+)
org.gradle.configuration-cache=true

# JVM args for daemon
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Parallel execution
org.gradle.parallel=true