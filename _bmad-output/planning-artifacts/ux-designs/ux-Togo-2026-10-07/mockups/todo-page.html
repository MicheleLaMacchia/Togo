<!DOCTYPE html>
<html lang="it" id="scuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOGO - Cose da fare</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0B0F17;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .device-frame {
      width: 412px;
      height: 915px;
      background: var(--surface-base);
      border-radius: 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 0 10px #1E293B;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 3px solid var(--border-crisp);
    }

    .status-bar {
      height: 38px;
      background: var(--surface-base);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-primary);
      border-bottom: 1px solid var(--surface-subtle);
      z-index: 10;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Header: history (Spesa only), arrows, title, share, settings */
    .app-bar {
      background: var(--surface-base);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 2px;
      border-bottom: 2px solid var(--border-crisp);
      z-index: 10;
      min-height: 64px;
    }

    .header-side {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .app-title-group {
      flex: 1;
      min-width: 0;
      text-align: center;
      padding: 0 2px;
    }

    .app-title-group h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: var(--ink-primary);
      line-height: 1.1;
      white-space: nowrap;
    }

    .app-title-group .subtitle {
      font-size: 11px;
      font-weight: 800;
      color: var(--ink-secondary);
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .badge-counter {
      background: var(--badge-bg);
      color: var(--badge-ink);
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 10px;
      letter-spacing: 0.3px;
    }

    .icon-btn {
      width: var(--touch-target-min);
      height: var(--touch-target-min);
      background: var(--surface-subtle);
      border: 2px solid var(--border-crisp);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink-primary);
      font-weight: 700;
      box-shadow: 2px 2px 0px #0F172A;
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.4;
    }

    .icon-btn.arrow {
      background: var(--surface-base);
    }

    .icon-btn.disabled {
      color: var(--ink-muted);
      border-color: var(--border-hairline);
      box-shadow: none;
      cursor: default;
    }

    /* Main scroll area */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 88px 16px;
      background: var(--surface-subtle);
    }

    .category-group {
      background: var(--surface-card);
      border: 2px solid var(--border-crisp);
      border-radius: 16px;
      margin-bottom: 12px;
      box-shadow: 3px 3px 0px #0F172A;
      overflow: hidden;
    }

    .category-header {
      background: var(--surface-subtle);
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border-crisp);
      letter-spacing: -0.2px;
      text-transform: uppercase;
    }

    .category-tag {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .category-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ink-primary);
      border: 1px solid var(--border-crisp);
    }

    .item-list {
      list-style: none;
    }

    /* Action row: checkbox, text, urgency + area badges, urgency accent */
    .action-row {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px 10px 19px;
      min-height: 56px;
      border-bottom: 1.5px solid var(--border-hairline);
      background: var(--surface-card);
    }

    .action-row:last-child {
      border-bottom: none;
    }

    .action-details {
      flex: 1;
      min-width: 0;
    }

    .action-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-primary);
      line-height: 1.3;
    }

    .struck .action-name {
      text-decoration: line-through;
      color: var(--ink-struck);
      font-weight: 600;
    }

    /* Fatte section */
    .fatte-container {
      background: var(--surface-subtle);
      border: 2px dashed var(--border-crisp);
      border-radius: 16px;
      margin-top: 14px;
      padding: 4px;
    }

    .fatte-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .fatte-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }

    .fatte-badge {
      background: var(--badge-bg);
      color: var(--badge-ink);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .fatte-hint {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-secondary);
    }

    .fatte-container .action-row {
      background: var(--surface-subtle);
      border-radius: 8px;
      margin-bottom: 4px;
      border-bottom: none;
    }

    .fatte-container .action-row:last-of-type {
      margin-bottom: 0;
    }

    .conclude-btn {
      width: 100%;
      height: 52px;
      background: var(--accent-action);
      color: var(--badge-ink);
      border: 2px solid var(--border-crisp);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .conclude-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.5;
    }

    /* Focus visibile per tastiera / D-pad / Switch Access */
    .icon-btn:focus-visible, .checkbox-touch:focus-visible, .conclude-btn:focus-visible, .fab:focus-visible {
      outline: 3px solid var(--accent-highlight);
      outline-offset: 2px;
    }
    /* FAB */
    .fab {
      position: absolute;
      right: 24px;
      bottom: 28px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-action);
      color: var(--badge-ink);
      border: 3px solid var(--fab-border);
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.42), 0 0 0 2px #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
    }

    .fab svg {
      width: 28px;
      height: 28px;
      stroke-width: 2.6;
    }

  </style>
  <link rel="stylesheet" href="mockups.css">
</head>
<body>

  <div class="device-frame">
    <div class="status-bar">
      <span>10:42</span>
      <div class="status-icons">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="18" height="11" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="14"/></svg>
      </div>
    </div>

    <!-- Header: on Da fare history is hidden, arrows + share + settings stay -->
    <div class="app-bar">
      <div class="header-side">
        <button class="icon-btn arrow" aria-label="Torna a Spesa" title="Torna a Spesa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>

      <div class="app-title-group">
        <h1>Da fare (4)</h1>
      </div>

      <div class="header-side">
        <button class="icon-btn arrow disabled" aria-label="Nessuna pagina a destra" title="Nessuna pagina a destra" aria-disabled="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="icon-btn" aria-label="Condividi" title="Condividi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="Impostazioni" title="Impostazioni">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.14.38.35.72.6 1 .3.27.67.42 1.1.4H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.6z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="content-scroll">
      <!-- Casa -->
      <details class="category-group" open>
        <summary class="category-header">
          <span class="category-tag">
            <span class="category-dot"></span>
            <span>Casa</span>
          </span>
          <span style="font-size: 11px; font-weight: 800; color: var(--ink-secondary);">2 AZIONI</span>
        </summary>
        <ul class="item-list">
          <li class="action-row urgency-relaxed">
            <label class="checkbox-touch">
              <input type="checkbox" aria-label="Comprare le lampadine">
              <span class="custom-checkbox" aria-hidden="true"></span>
            </label>
            <button class="action-details action-edit" type="button">
              <span class="action-name">Comprare le lampadine</span>
              <span class="badge-row">
                <span class="badge urgency-relaxed">A tempo perso</span>
                <span class="badge area-badge">Casa</span>
              </span>
            </button>
          </li>
          <li class="action-row urgency-exceptional">
            <label class="checkbox-touch">
              <input type="checkbox" aria-label="Riordinare il garage">
              <span class="custom-checkbox" aria-hidden="true"></span>
            </label>
            <button class="action-details action-edit" type="button">
              <span class="action-name">Riordinare il garage</span>
              <span class="badge-row">
                <span class="badge urgency-exceptional">Eccezionale</span>
                <span class="badge area-badge">Casa</span>
              </span>
            </button>
          </li>
        </ul>
      </details>

      <!-- Pratiche -->
      <details class="category-group" open>
        <summary class="category-header">
          <span class="category-tag">
            <span class="category-dot"></span>
            <span>Pratiche</span>
          </span>
          <span style="font-size: 11px; font-weight: 800; color: var(--ink-secondary);">1 AZIONE</span>
        </summary>
        <ul class="item-list">
          <li class="action-row urgency-urgent">
            <label class="checkbox-touch">
              <input type="checkbox" aria-label="Pagare la bolletta">
              <span class="custom-checkbox" aria-hidden="true"></span>
            </label>
            <button class="action-details action-edit" type="button">
              <span class="action-name">Pagare la bolletta</span>
              <span class="badge-row">
                <span class="badge urgency-urgent">Urgente</span>
                <span class="badge area-badge">Pratiche</span>
              </span>
            </button>
          </li>
        </ul>
      </details>

      <!-- Salute -->
      <details class="category-group" open>
        <summary class="category-header">
          <span class="category-tag">
            <span class="category-dot"></span>
            <span>Salute</span>
          </span>
          <span style="font-size: 11px; font-weight: 800; color: var(--ink-secondary);">1 AZIONE</span>
        </summary>
        <ul class="item-list">
          <li class="action-row urgency-urgent">
            <label class="checkbox-touch">
              <input type="checkbox" aria-label="Chiamare il dentista">
              <span class="custom-checkbox" aria-hidden="true"></span>
            </label>
            <button class="action-details action-edit" type="button">
              <span class="action-name">Chiamare il dentista</span>
              <span class="badge-row">
                <span class="badge urgency-urgent">Urgente</span>
                <span class="badge area-badge">Salute</span>
              </span>
            </button>
          </li>
        </ul>
      </details>

      <!-- Fatte -->
      <details class="fatte-container" open>
        <summary class="fatte-header">
          <span class="fatte-title">
            <svg class="section-chevron" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            <span>Fatte</span>
            <span class="fatte-badge">2</span>
          </span>
          <span class="fatte-hint">Mostra o nascondi</span>
        </summary>

        <ul class="item-list" style="margin-top: 4px;">
          <li class="action-row urgency-relaxed struck">
            <label class="checkbox-touch">
              <input type="checkbox" aria-label="Fare la spesa" checked>
              <span class="custom-checkbox" aria-hidden="true"></span>
            </label>
            <div class="action-details">
              <div class="action-name">Fare la spesa</div>
              <div class="badge-row">
                <span class="badge urgency-relaxed">A tempo perso</span>
                <span class="badge area-badge">Casa</span>
              </div>
            </div>
          </li>
          <li class="action-row urgency-relaxed struck">
            <label class="checkbox-touch">
              <input type="checkbox" aria-label="Ritirare il pacco" checked>
              <span class="custom-checkbox" aria-hidden="true"></span>
            </label>
            <div class="action-details">
              <div class="action-name">Ritirare il pacco</div>
              <div class="badge-row">
                <span class="badge urgency-relaxed">A tempo perso</span>
                <span class="badge area-badge">Pratiche</span>
              </div>
            </div>
          </li>
        </ul>

        <button class="conclude-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>
          Concludi attività
        </button>
      </details>
    </div>

    <button class="fab" aria-label="Aggiungi cosa da fare" title="Aggiungi cosa da fare">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

</body>
</html>
